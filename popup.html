<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>openchess.review</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Local Chessboard CSS -->
    <link rel="stylesheet" href="chessboard-1.0.0.min.css">
    
    <!-- Local Library Scripts (jQuery MUST be first!) -->
    <script src="jquery.min.js"></script>
    <script src="chessboard-1.0.0.min.js"></script>
    <script src="chess.min.js"></script>
    <script src="chart.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1><i class="fa-solid fa-chess-knight"></i> openchess.review</h1>
            <nav class="tabs">
                <button id="tab-review" class="active" onclick="switchTab('review')"><i class="fa-solid fa-magnifying-glass-chart"></i> Review</button>
                <button id="tab-puzzles" onclick="switchTab('puzzles')"><i class="fa-solid fa-puzzle-piece"></i> Puzzles</button>
                <button id="tab-saved" onclick="switchTab('saved')"><i class="fa-solid fa-bookmark"></i> Saved</button>
            </nav>
        </header>

        <!-- Chapter: Review -->
        <div id="chapter-review" class="chapter">
            <div class="input-section">
                <textarea id="pgn-input" placeholder="Paste your PGN text here..."></textarea>
                <div class="input-actions">
                    <button class="btn-primary" onclick="processPGN(true)"><i class="fa-solid fa-play"></i> Analyze PGN</button>
                    <label class="btn-secondary file-upload-label">
                        <i class="fa-solid fa-folder-open"></i> Upload PGN
                        <input type="file" id="pgn-file" accept=".pgn" style="display:none;" onchange="handleFileUpload(event)">
                    </label>
                </div>
            </div>

            <div id="review-studio" class="review-studio hidden">
                <div class="board-column">
                    <div class="player-tag" id="player-black">Black Player</div>
                    <div id="board" style="width: 280px;"></div>
                    <div class="player-tag" id="player-white">White Player</div>
                    
                    <div class="board-controls">
                        <button onclick="boardStart()"><i class="fa-solid fa-backward-step"></i></button>
                        <button onclick="boardPrev()"><i class="fa-solid fa-chevron-left"></i></button>
                        <button onclick="boardNext()"><i class="fa-solid fa-chevron-right"></i></button>
                        <button onclick="boardEnd()"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                </div>

                <div class="sidebar-column">
                    <div class="section-title">Accuracy & Breakdown</div>
                    <div id="classification-counts" class="classification-counts"></div>
                    
                    <div class="section-title">Move Notation</div>
                    <div id="notation-list" class="notation-list"></div>
                </div>
            </div>

            <div class="eval-chart-container">
                <canvas id="evalChart"></canvas>
            </div>
        </div>

        <!-- Chapter: Puzzles -->
        <div id="chapter-puzzles" class="chapter hidden">
            <div class="puzzle-container">
                <div id="puzzle-board" style="width: 280px;"></div>
                <div class="puzzle-info">
                    <div id="puzzle-status" class="puzzle-status">Loading puzzle...</div>
                    <button class="btn-secondary" onclick="showPuzzleHint()"><i class="fa-solid fa-lightbulb"></i> Hint</button>
                    <button class="btn-primary" onclick="fetchNewPuzzle()"><i class="fa-solid fa-rotate-right"></i> Next Puzzle</button>
                </div>
            </div>
        </div>

        <!-- Chapter: Saved Games -->
        <div id="chapter-saved" class="chapter hidden">
            <div class="section-title">Saved Games History</div>
            <div id="saved-games-list" class="saved-games-list"></div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
